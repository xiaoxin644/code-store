<!DOCTYPE html>

<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>兑换码自助商城</title>

  <style>

    body {

      margin: 0;

      padding: 24px;

      font-family: Arial, sans-serif;

      background: #f4f5f7;

      color: #222;

    }

    .card {

      max-width: 420px;

      margin: 40px auto;

      padding: 24px;

      background: white;

      border-radius: 16px;

      box-shadow: 0 4px 18px #0001;

    }

    h1 { font-size: 25px; }

    .product {

      padding: 16px;

      border: 1px solid #eee;

      border-radius: 12px;

    }

    button {

      width: 100%;

      padding: 13px;

      margin-top: 14px;

      border: 0;

      border-radius: 9px;

      background: #222;

      color: white;

      font-size: 16px;

    }

    .hint { color: #666; font-size: 14px; }

  </style>

</head>

<body>

  <div class="card">

    <h1>兑换码自助商城</h1>

    <p class="hint">选择商品并提交购买需求</p>

    <div class="product">

      <h3>数字兑换码</h3>

      <p>价格：请联系商家确认</p>

      <p class="hint">购买后按订单确认情况发放兑换码。</p>

      <button onclick="alert('这是演示页面，暂未接入真实下单和付款系统。')">

        立即购买（演示）

      </button>

    </div>

  </div>

</body>

</html>
